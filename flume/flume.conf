agent.sources = spool
agent.channels = mem
agent.sinks = hdfsSink

agent.sources.spool.type = spooldir
agent.sources.spool.spoolDir = /spooldir
agent.sources.spool.fileHeader = true
agent.sources.spool.basenameHeader = true
agent.sources.spool.channels = mem

agent.channels.mem.type = memory
agent.channels.mem.capacity = 10000
agent.channels.mem.transactionCapacity = 1000

agent.sinks.hdfsSink.type = hdfs
agent.sinks.hdfsSink.hdfs.path = hdfs://namenode:9000/data/flume/%y-%m-%d/
agent.sinks.hdfsSink.hdfs.fileType = DataStream
agent.sinks.hdfsSink.channel = mem
