version: '3.8'

services:
  # =======================
  # ZOOKEEPER
  # =======================
  zookeeper:
    image: zookeeper:3.8.4
    container_name: zookeeper
    ports:
      - "2181:2181"

  # =======================
  # KAFKA
  # =======================
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JVM_PERFORMANCE_OPTS: "-Djava.lang.management.jmxremote=false"

  # =======================
  # HDFS NAMENODE
  # =======================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name

  # =======================
  # HDFS DATANODE
  # =======================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
    ports:
      - "50075:50075"
    volumes:
      - hdfs_datanode:/hadoop/dfs/data

  # =======================
  # SPARK MASTER
  # =======================
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    ports:
      - "8080:8080"
    environment:
      - SPARK_MODE=master

  # =======================
  # SPARK WORKER
  # =======================
  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER=spark://spark-master:7077

  # =======================
  # KAFKA PRODUCER
  # =======================
  kafka-producer:
    build:
      context: ./web-scraper
      dockerfile: Dockerfile
    container_name: kafka-producer
    depends_on:
      - kafka
    command: ["sh", "-c", "sleep 10 && python producer_api.py"]

  # =======================
  # SPARK CONSUMER
  # =======================
  spark-consumer:
    build:
      context: ./spark-streaming
      dockerfile: Dockerfile
    container_name: spark-consumer
    depends_on:
      - kafka
      - spark-master
      - namenode
    command: ["sh", "-c", "sleep 15 && python stream_kafka_to_hdfs.py"]

volumes:
  hdfs_namenode:
  hdfs_datanode:
