version: '3.8'

services:
 
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name

  # =======================
  # HDFS DATANODE
  # =======================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
    ports:
      - "50075:50075"
    volumes:
      - hdfs_datanode:/hadoop/dfs/data

  

  
  flume:
    build: ./flume
    container_name: flume
    volumes:
      - ./flume/spooldir:/spooldir
      - ./flume/conf:/opt/flume/conf
    environment:
      JAVA_HOME: /opt/java/openjdk   # ajuste selon ton Dockerfile / JDK
    command: >
      /opt/flume/bin/flume-ng agent
      -n agent
      -f /opt/flume/conf/flume.conf
      --conf /opt/flume/conf
      -Dflume.root.logger=INFO,console


  postgres:
      image: postgres:15
      container_name: postgres
      environment:
        POSTGRES_DB: analytics
        POSTGRES_USER: user
        POSTGRES_PASSWORD: 123456
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./postgres-init:/docker-entrypoint-initdb.d

  sqoop:
      build:
        context: ./sqoop
        dockerfile: Dockerfile.sqoop
      container_name: sqoop
      environment:
        HADOOP_CONF_DIR: /etc/hadoop
        HADOOP_USER_NAME: root
      depends_on:
        - namenode
        - postgres
      entrypoint: ["/bin/bash", "/scripts/import_export.sh"]

  log_generator:
    build: ./loggen
    container_name: loggen
    volumes:
      - ./flume/spooldir:/spooldir    # generator writes directly to this folder
      - ./flume/tmp:/tmp              # matches your Python script
    depends_on:
      - flume  

  zookeeper:
    image: zookeeper:3.8.4
    container_name: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1

      # Connexion à Zookeeper
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      # Listeners Kafka
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      # Réplication minimale
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Auto-create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Correction du bug CGroupV2
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:-UseContainerSupport"

    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 10s
      retries: 10

     

  # ----------------- #
  # Python Producer   #
  # ----------------- #
  producer:
    build:
      context: ./kafka/web-scraper
      dockerfile: Dockerfile
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HDFS_URI=hdfs://namenode:9000

  # ----------------- #
  # Spark Master      #
  # ----------------- #
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8083:8083"
      - "7077:7077"
    depends_on:
      - namenode
      - kafka

  # ----------------- #
  # Spark Worker      #
  # ----------------- #
  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"

volumes:
  hdfs_namenode:
  hdfs_datanode:
  postgres_data: